components:
  schemas:
    CustomerResponse:
      properties:
        customerId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        username:
          type: string
      type: object
    ErrorResponse:
      properties:
        error:
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
          type: object
      type: object
  securitySchemes:
    default:
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://localhost:9443/oauth2/token
      type: oauth2
info:
  description: |
    Pass-through/managed proxy in front of the public DummyJSON mock REST API (https://dummyjson.com), fronted by WSO2 Micro Integrator for correlation ID handling, header curation, timeout handling, and upstream error mapping.
  title: Customers API
  version: 1.0.0
openapi: 3.0.1
paths:
  /{customerId}:
    get:
      operationId: getCustomer
      parameters:
      - description: Numeric customer ID
        in: path
        name: customerId
        required: true
        schema:
          pattern: ^[0-9]+$
          type: string
      - description: Optional caller-supplied correlation ID; generated if absent
        in: header
        name: X-Correlation-ID
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: Customer profile retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Malformed customerId
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Customer not found upstream
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Upstream connection failure
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Upstream response timeout
      security:
      - default: []
      summary: Get customer profile
security:
- default: []
servers:
- url: https://localhost:8243/customers/1.0.0
