openapi: 3.0.1
info:
  title: AccountsBalanceAPI
  description: |
    Returns the balance for a Jamii Savings account, backed by an H2 datasource queried through WSO2 Micro Integrator.
  version: 1.0.0
servers:
 -
  url: https://localhost:8243/accounts/1.0.0
security:
 -
  default: []
paths:
  /{accountNumber}/balance:
    get:
      summary: Get account balance
      operationId: getAccountBalance
      parameters:
       -
        name: accountNumber
        in: path
        description: 10-digit numeric account number
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^[0-9]{10}$"
          type: string
      responses:
        "200":
          description: Account balance retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalanceResponse"
        "400":
          description: Malformed account number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Database-level failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
components:
  schemas:
    AccountBalanceResponse:
      type: object
      properties:
        accountNumber:
          type: string
        balance:
          type: object
          properties:
            amount:
              type: number
            currency:
              type: string
        requestId:
          type: string
        status:
          type: string
          enum:
           - ACTIVE
           - DORMANT
           - CLOSED
        timestamp:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
  securitySchemes:
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://test.com
          scopes: {}
        clientCredentials:
          tokenUrl: https://localhost:9443/oauth2/token
          scopes: {}
x-wso2-auth-header: Authorization
x-wso2-api-key-header: ApiKey
x-wso2-cors:
  corsConfigurationEnabled: false
  accessControlAllowOrigins:
   - '*'
  accessControlAllowCredentials: false
  accessControlAllowHeaders:
   - authorization
   - Access-Control-Allow-Origin
   - Content-Type
   - SOAPAction
   - apikey
   - Internal-Key
  accessControlAllowMethods:
   - GET
   - PUT
   - POST
   - DELETE
   - PATCH
   - OPTIONS
x-wso2-production-endpoints:
  urls:
   - http://jamii-mi:8290/accounts
  type: http
x-wso2-sandbox-endpoints:
  urls:
   - http://jamii-mi:8290/accounts
  type: http
x-wso2-basePath: /accounts/1.0.0
x-wso2-transports:
 - http
 - https
x-wso2-application-security:
  security-types:
   - oauth2
  optional: false
x-wso2-response-cache:
  enabled: false
  cacheTimeoutInSeconds: 300
