openapi: 3.0.1
info:
  title: LoansEligibilityAPI
  description: |
    Accepts a JSON eligibility request, calls a public SOAP test service (sondahub.com's generic "Bank" SOAP sandbox) to retrieve customer KYC/risk data, and returns a JSON eligibility decision. NOTE: the SOAP backend has no native "eligibility" operation - the eligibility rule is applied entirely in the Micro Integrator mediation layer. See README for details.
  version: 1.0.0
servers:
 -
  url: https://localhost:8243/loans/1.0.0
security:
 -
  default: []
paths:
  /eligibility:
    post:
      summary: Check loan eligibility for a customer
      operationId: checkLoanEligibility
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityRequest"
        required: true
      responses:
        "200":
          description: Eligibility decision returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityResponse"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Customer not found (SOAP Fault code=not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: SOAP backend unavailable or returned an unexpected fault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: SOAP backend response timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
components:
  schemas:
    EligibilityRequest:
      required:
       - customerId
       - requestedAmount
      type: object
      properties:
        customerId:
          type: integer
        requestedAmount:
          type: number
    EligibilityResponse:
      type: object
      properties:
        correlationId:
          type: string
        customerId:
          type: string
        eligible:
          type: boolean
        reason:
          type: string
        requestId:
          type: string
        riskScore:
          type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
  securitySchemes:
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://test.com
          scopes: {}
        clientCredentials:
          tokenUrl: https://localhost:9443/oauth2/token
          scopes: {}
x-wso2-auth-header: Authorization
x-wso2-api-key-header: ApiKey
x-wso2-cors:
  corsConfigurationEnabled: false
  accessControlAllowOrigins:
   - '*'
  accessControlAllowCredentials: false
  accessControlAllowHeaders:
   - authorization
   - Access-Control-Allow-Origin
   - Content-Type
   - SOAPAction
   - apikey
   - Internal-Key
  accessControlAllowMethods:
   - GET
   - PUT
   - POST
   - DELETE
   - PATCH
   - OPTIONS
x-wso2-production-endpoints:
  urls:
   - http://jamii-mi:8290/loans
  type: http
x-wso2-sandbox-endpoints:
  urls:
   - http://jamii-mi:8290/loans
  type: http
x-wso2-basePath: /loans/1.0.0
x-wso2-transports:
 - http
 - https
x-wso2-application-security:
  security-types:
   - oauth2
  optional: false
x-wso2-response-cache:
  enabled: false
  cacheTimeoutInSeconds: 300
