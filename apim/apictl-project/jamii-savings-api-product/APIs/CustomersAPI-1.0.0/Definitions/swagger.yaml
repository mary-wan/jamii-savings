openapi: 3.0.1
info:
  title: CustomersAPI
  description: |
    Pass-through/managed proxy in front of the public DummyJSON mock REST API (https://dummyjson.com), fronted by WSO2 Micro Integrator for correlation ID handling, header curation, timeout handling, and upstream error mapping.
  version: 1.0.0
servers:
 -
  url: https://localhost:8243/customers/1.0.0
security:
 -
  default: []
paths:
  /{customerId}:
    get:
      summary: Get customer profile
      operationId: getCustomer
      parameters:
       -
        name: customerId
        in: path
        description: Numeric customer ID
        required: true
        style: simple
        explode: false
        schema:
          pattern: "^[0-9]+$"
          type: string
       -
        name: X-Correlation-ID
        in: header
        description: Optional caller-supplied correlation ID; generated if absent
        required: false
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Customer profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Malformed customerId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Customer not found upstream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream connection failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Upstream response timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
       -
        default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-wso2-application-security:
        security-types:
         - oauth2
        optional: false
components:
  schemas:
    CustomerResponse:
      type: object
      properties:
        customerId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        username:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
  securitySchemes:
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://test.com
          scopes: {}
        clientCredentials:
          tokenUrl: https://localhost:9443/oauth2/token
          scopes: {}
x-wso2-auth-header: Authorization
x-wso2-api-key-header: ApiKey
x-wso2-cors:
  corsConfigurationEnabled: false
  accessControlAllowOrigins:
   - '*'
  accessControlAllowCredentials: false
  accessControlAllowHeaders:
   - authorization
   - Access-Control-Allow-Origin
   - Content-Type
   - SOAPAction
   - apikey
   - Internal-Key
  accessControlAllowMethods:
   - GET
   - PUT
   - POST
   - DELETE
   - PATCH
   - OPTIONS
x-wso2-production-endpoints:
  urls:
   - http://jamii-mi:8290/customers
  type: http
x-wso2-sandbox-endpoints:
  urls:
   - http://jamii-mi:8290/customers
  type: http
x-wso2-basePath: /customers/1.0.0
x-wso2-transports:
 - http
 - https
x-wso2-application-security:
  security-types:
   - oauth2
  optional: false
x-wso2-response-cache:
  enabled: false
  cacheTimeoutInSeconds: 300
