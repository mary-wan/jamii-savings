components:
  schemas:
    AccountBalanceResponse:
      properties:
        accountNumber:
          type: string
        balance:
          properties:
            amount:
              type: number
            currency:
              type: string
          type: object
        requestId:
          type: string
        status:
          enum:
          - ACTIVE
          - DORMANT
          - CLOSED
          type: string
        timestamp:
          type: string
      type: object
    ErrorResponse:
      properties:
        error:
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
          type: object
      type: object
  securitySchemes:
    default:
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://localhost:9443/oauth2/token
      type: oauth2
info:
  description: |
    Returns the balance for a Jamii Savings account, backed by an H2 datasource queried through WSO2 Micro Integrator.
  title: Accounts Balance API
  version: 1.0.0
openapi: 3.0.1
paths:
  /{accountNumber}/balance:
    get:
      operationId: getAccountBalance
      parameters:
      - description: 10-digit numeric account number
        in: path
        name: accountNumber
        required: true
        schema:
          pattern: ^[0-9]{10}$
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceResponse'
          description: Account balance retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Malformed account number
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Account not found
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Database-level failure
      security:
      - default: []
      summary: Get account balance
security:
- default: []
servers:
- url: https://localhost:8243/accounts/1.0.0
