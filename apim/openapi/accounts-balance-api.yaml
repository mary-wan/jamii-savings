openapi: 3.0.1
info:
  title: Accounts Balance API
  description: >
    Returns the balance for a Jamii Savings account, backed by an H2 datasource
    queried through WSO2 Micro Integrator.
  version: "1.0.0"
servers:
  - url: https://localhost:8243/accounts/1.0.0
paths:
  /{accountNumber}/balance:
    get:
      operationId: getAccountBalance
      summary: Get account balance
      parameters:
        - name: accountNumber
          in: path
          required: true
          description: 10-digit numeric account number
          schema:
            type: string
            pattern: '^[0-9]{10}$'
      responses:
        "200":
          description: Account balance retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalanceResponse"
        "400":
          description: Malformed account number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Database-level failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - default: []
components:
  schemas:
    AccountBalanceResponse:
      type: object
      properties:
        accountNumber:
          type: string
        status:
          type: string
          enum: [ACTIVE, DORMANT, CLOSED]
        balance:
          type: object
          properties:
            amount:
              type: number
            currency:
              type: string
        requestId:
          type: string
        timestamp:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
  securitySchemes:
    default:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://localhost:9443/oauth2/token
          scopes: {}
security:
  - default: []
